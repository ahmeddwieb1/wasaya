services:
  backend:
    image: ahmeddwieb/elwasya:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - safepulse-network
  frontend:
    image: ahmeddwieb/elwasya-frontend:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - safepulse-network

networks:
  safepulse-network:
    name: safepulse-network