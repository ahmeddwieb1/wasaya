services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  db:
    image: "mysql:8.4.5"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wasaya
    ports:
      - target: 3306
        published: 3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
      image: "quay.io/minio/minio:latest"
      container_name: minio
      restart: unless-stopped
      environment:
        MINIO_ROOT_USER: "minoadmin"
        MINIO_ROOT_PASSWORD: "minioadmin"
        MINIO_PROMETHEUS_AUTH_TYPE: "public"
      ports:
        - "9000:9000"
        - "9001:9001"
      command: server /data --console-address ":9001"
      networks:
        - backend-net
      volumes:
        - minio-data:/var/lib/data

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiYzExZjA1ODA4MTViYjVhNzlkMGEzY2U4YjJhZDA5MGUiLCJ0IjoiYjI5ZmQ2NjAtNjE1Yy00YTRjLTg0Y2EtNTBiNDI2ZDhmYTVkIiwicyI6Ik1EZG1aalprT1dJdE5HTTVZaTAwTnpJNExUaG1PRFl0TnpOaU56QXlNREExTmpGaiJ9
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "promtool", "check", "ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - backend-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - backend-net
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - backend-net
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: rootpassword
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=root"
    ports:
      - "9104:9104"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      
networks:
  backend-net:
    name: elwasya_backend-net
    driver: bridge

volumes:
  mysql-data:
  minio-data:
  prometheus-data:
  grafana-data: