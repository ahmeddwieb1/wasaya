services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

#  frontend:
#    build:
#      context: ../SafePulse
#      dockerfile: Dockerfile
#    restart: unless-stopped
#    env_file:
#      - .env
#    ports:
#      - "3000:3000"
#    networks:
#      - backend-net

  db:
    image: "mysql:8.4.5"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wasaya
    ports:
      - target: 3306
        published: 3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
      image: "quay.io/minio/minio:latest"
      container_name: minio
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "9000:9000"
        - "9001:9001"
      command: server /data --console-address ":9001"
      networks:
        - backend-net
      volumes:
        - minio-data:/var/lib/data

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiYzExZjA1ODA4MTViYjVhNzlkMGEzY2U4YjJhZDA5MGUiLCJ0IjoiYjI5ZmQ2NjAtNjE1Yy00YTRjLTg0Y2EtNTBiNDI2ZDhmYTVkIiwicyI6Ik1EZG1aalprT1dJdE5HTTVZaTAwTnpJNExUaG1PRFl0TnpOaU56QXlNREExTmpGaiJ9
    networks:
      - backend-net

networks:
  backend-net:
    name: elwasya_backend-net
    driver: bridge

volumes:
  mysql-data:
  minio-data:
