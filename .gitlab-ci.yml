stages:
  - test
  - docker
  - playbook
  - deploy-dev
  - update-config
  - deploy-prod
  - production_test

variables:
  IMAGE_NAME: $DOCKER_USERNAME/elwasya
  APP_VERSION: $CI_PIPELINE_IID
  S3_BUCKET: ahmeddwieb-wasaya-media
  AWS_REGION: eu-west-1
#todo add test stage

docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:dind
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
    - docker build -t $IMAGE_NAME:$APP_VERSION .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd)/.trivycache:/root/.cache/
        aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL --format table $IMAGE_NAME:$APP_VERSION
    - docker push $IMAGE_NAME:$APP_VERSION
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
#develop
playbook:
  stage: playbook
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client ansible
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - ansible-playbook --private-key ~/.ssh/id_rsa -i ansible/hosts.ini ansible/playbook1
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

#develop
deploy_dev:
  stage: deploy-dev
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo $EC2_USER-$EC2_HOST
    - echo $IMAGE_NAME:$APP_VERSION
    - env | grep -E '^(SECRET_KEY|SMTP_HOST|SMTP_PASSWORD|SMTP_USERNAME)' >> .env
  script:
    - |
      scp -o StrictHostKeyChecking=no .env $EC2_USER@$EC2_HOST:/opt/wasaya/.env
      ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "
        cd /opt/wasaya
        export IMAGE_NAME=$IMAGE_NAME
        export APP_VERSION=$APP_VERSION
        docker pull $IMAGE_NAME:$APP_VERSION
        docker compose down || true
        docker compose up -d
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

#production
update-config:
  stage: update-config
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - aws s3 cp docker-compose.prod.yml "s3://${S3_BUCKET}/docker-compose.yml"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

promote-latest:
  stage: update-config
  image: docker:24
  services:
    - docker:dind
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
    - docker pull $IMAGE_NAME:$APP_VERSION
    - docker tag $IMAGE_NAME:$APP_VERSION $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
#production
deploy_prod:
  stage: deploy-prod
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - |
      aws autoscaling describe-auto-scaling-groups \
        --auto-scaling-group-names wasaya-asg \
        --query 'AutoScalingGroups[0].Instances[].InstanceId' \
        --output text > instance_ids.txt
    - cat instance_ids.txt
    - |
      aws ssm send-command \
        --instance-ids $(cat instance_ids.txt) \
        --document-name "AWS-RunShellScript" \
        --parameters '{"commands":["cd /opt/wasaya", "aws s3 cp s3://ahmeddwieb-wasaya-media/docker-compose.yml .", "docker compose pull backend", "docker compose up -d backend"]}' \
        --region "$AWS_REGION"
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    when: manual

production_test:
  stage: production_test
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - sleep 300
    - curl -f http://api.ahmeddwieb.me/health/db
    - curl -f http://api.ahmeddwieb.me/health
    - curl -f http://api.ahmeddwieb.me/docs
  rules:
  - if: $CI_COMMIT_BRANCH == "master"