apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-statefulset
spec:
  selector:
    matchLabels:
      app: mysql # has to match .spec.template.metadata.labels
  serviceName: "db-service"
  replicas: 1 # by default is 1
  template:
    metadata:
      labels:
        app: mysql # has to match .spec.selector.matchLabels
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.5
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: data-volume
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data-volume            # matches volumeMounts name in the container
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Mi


